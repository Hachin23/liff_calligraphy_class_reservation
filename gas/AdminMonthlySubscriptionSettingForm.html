<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チケット登録</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0px; }
    .container { max-width: 700px; margin: auto; background: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    h2 { text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 10px; }
    textarea{ resize: vertical; }
    button { width: 100%; padding: 14px; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover{ background:#1976D2; }
    .price{ margin-top:8px; color:#666; font-size:15px; }
  </style>
</head>
<body>

<div id="loader">データを読み込み中...</div>
<div id="monthlyForm" style="display:none;">
  <div>
    <label>生徒</label>
    <select id="studentSelect">
      <option value="">選択してください</option>
    </select>
  </div>

  <div>
    <label>稽古回数（デフォルト）</label>
    <input type="number" id="defaultCount" min="2">
  </div>

  <div>
    <label>今月の稽古回数</label>
    <input type="number" id="currentCount" min="2">
  </div>

  <div>
    <label>来月の稽古回数</label>
    <input type="number" id="nextCount" min="2">
  </div>

  <button id="saveBtn">
    登録
  </button>

</div>

<script>

window.onload = function() {
  google.script.run
    .withSuccessHandler(function(data) {
      createStudentSelect(data);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('monthlyForm').style.display = 'block';
    })
    .withFailureHandler(function(error) {
      console.error(error);

      document.getElementById('loader').style.display = 'none';
      alert('生徒一覧の取得に失敗しました。');
    })
    .getStudentListForUI();
};

function createStudentSelect(students){

  const select = document.getElementById("studentSelect");
  students.forEach(s => {
    const option = document.createElement("option");
    option.value = s.lineId;
    option.textContent = s.name;
    select.appendChild(option);
  });
}

// 入力値のバリデーション
function validationInput(data) {
  // 「e」が入力可能なので、文字列として整数形式をチェックする。
  const isPositiveInteger = value => /^\d+$/.test(String(value)) && Number(value) > 0;

  if (!isPositiveInteger(data.defaultCount)) {
    throw new Error("デフォルトの稽古回数は1回以上の整数で登録してください");
  }
  if (!isPositiveInteger(data.currentCount)) {
    throw new Error("今月の稽古回数は1回以上の整数で登録してください");
  }
  if (!isPositiveInteger(data.nextCount)) {
    throw new Error("来月の稽古回数は1回以上の整数で登録してください");
  }
}

document.getElementById("saveBtn").addEventListener("click", function(){

  const select = document.getElementById("studentSelect");
  const data = {
    userId: select.value,
    userName: select.options[select.selectedIndex].text,
    defaultCount: document.getElementById("defaultCount").value,
    currentCount: document.getElementById("currentCount").value,
    nextCount: document.getElementById("nextCount").value
  };

  validationInput(data);

  // バリデーション後に数値化
  data.defaultCount = Number(data.defaultCount);
  data.currentCount = Number(data.currentCount);
  data.nextCount = Number(data.nextCount);

  if(!confirm(
    `生徒名：${data.userName}\n稽古回数（デフォルト）：${data.defaultCount}\n今月の稽古回数：${data.currentCount}\n来月の稽古回数：${data.nextCount}\nこの内容で稽古回数を登録しますか？`
  )) return;

  google.script.run
    .withSuccessHandler(()=>{
      alert("月の稽古回数を登録しました");
    })
    .withFailureHandler(err=>{
      alert(err.message);
    })
    .saveMonthlyLesson(data);
});


</script>
</body>
</html>
