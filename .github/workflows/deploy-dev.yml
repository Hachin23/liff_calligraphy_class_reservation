name: Deploy to Development GAS

on:
  push:
    branches:
      - develop
    paths:
      - 'gas/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      # 本番と同じGoogleアカウントで開発用GASを管理する想定のため、認証情報は共通
      - name: Create clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      # 開発用GASプロジェクトのスクリプトIDを指定
      - name: Create .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.DEV_SCRIPT_ID }}","rootDir":"./gas"}' > .clasp.json

      - name: Push Code
        run: clasp push --force

      # ↓ 開発用GASの既存デプロイIDを指定して新しいバージョンとして更新します
      - name: Deploy New Version to Existing Deployment
        run: |
          clasp deploy -i ${{ secrets.DEV_DEPLOYMENT_ID }} -d "Auto deployed via GitHub Actions (develop)"
